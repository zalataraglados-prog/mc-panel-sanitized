<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCIC 引导向导</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .header { display:flex; align-items:center; justify-content: space-between; gap:12px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin: 12px 0; }
    label { display: block; margin: 8px 0 6px; font-size: 13px; color: #cbd5f5; }
    input, select, textarea { width: 100%; background: #0b1220; color: #e2e8f0; border: 1px solid #1f2937; border-radius: 8px; padding: 8px 10px; }
    textarea { min-height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    button.secondary { background: #334155; }
    .output { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #0b1220; border-radius: 8px; padding: 12px; border: 1px solid #1f2937; min-height: 120px; }
    .hint { font-size: 12px; color: #94a3b8; }
    a { color: #93c5fd; }
    details { border: 1px dashed #334155; border-radius: 10px; padding: 10px 12px; margin: 10px 0; background: #0b1220; }
    summary { cursor: pointer; font-weight: 600; color: #e2e8f0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field { background: #0f172a; border: 1px solid #1f2937; border-radius: 8px; padding: 8px; }
    .field small { color: #94a3b8; display: block; margin-top: 6px; }
    .lang-switch { display:flex; align-items:center; gap:8px; font-size:12px; color:#cbd5f5; }
  
    .modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.7); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal.hidden { display: none; }
    .modal-card { width: min(520px, 92vw); background: #0b1220; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .modal-card h3 { margin: 0 0 8px; font-size: 16px; }
    .modal-card p { margin: 0 0 12px; color: #cbd5f5; line-height: 1.5; }
    .modal-card .actions { justify-content: flex-end; }
    .btn-disabled { opacity: 0.6; cursor: not-allowed; }

    .progress-wrap { margin-top: 12px; }
    .progress-bar { width: 100%; height: 10px; background: #0b1220; border: 1px solid #1f2937; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #22d3ee); transition: width 0.3s ease; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-top: 6px; }
    .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 data-i18n="title">MCIC 引导向导</h1>
      <div class="lang-switch">
        <span data-i18n="language">语言</span>
        <select id="lang">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="basic">基础设置</h2>
      <div class="row">
        <div>
          <label data-i18n="versionLabel">版本（默认 1.21.11）</label>
          <input id="version" data-i18n-placeholder="versionPlaceholder" placeholder="1.21.11" />
        </div>
        <div>
          <label data-i18n="profile">配置档位</label>
          <select id="profile">
            <option value="beginner" data-i18n="profileBeginner">新手</option>
            <option value="normal" selected data-i18n="profileNormal">标准</option>
            <option value="advanced" data-i18n="profileAdvanced">高级</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label data-i18n="otpLabel">一次性口令（OTP）</label>
          <input id="otp" data-i18n-placeholder="otpPlaceholder" placeholder="" />
          <div class="hint" data-i18n="otpHint">Plan / Apply / 保存需要 OTP。</div>
        </div>
      </div>
      <label data-i18n="importMode">导入方式</label>
      <select id="import_mode">
        <option value="none" data-i18n="importNone">不导入</option>
        <option value="paste" data-i18n="importPaste">粘贴配置串</option>
        <option value="file" data-i18n="importFile">从文件路径导入</option>
      </select>
      <label data-i18n="importValue">配置串 / 文件路径</label>
      <textarea id="import_value" data-i18n-placeholder="importPlaceholder" placeholder="粘贴配置串，或填写文件路径"></textarea>
      <div class="hint" data-i18n="importHint">若选择“从文件路径导入”，请填写服务器上的文件路径。</div>
    </div>

    <div class="card">
      <h2 data-i18n="beginner">新手选项</h2>
      <div class="row">
        <div>
          <label data-i18n="keepInventory">死亡不掉落</label>
          <select data-param="keepInventory">
            <option value="" data-i18n="default">默认</option>
            <option value="true" data-i18n="on">开启</option>
            <option value="false" data-i18n="off">关闭</option>
          </select>
        </div>
        <div>
          <label data-i18n="allowCheats">允许作弊（命令方块）</label>
          <select data-param="enable-command-block">
            <option value="" data-i18n="default">默认</option>
            <option value="true" data-i18n="on">开启</option>
            <option value="false" data-i18n="off">关闭</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="core">核心参数</h2>
      <div class="row">
        <div>
          <label data-i18n="expectedPlayers">预期人数</label>
          <input data-param="deploy.expected_players" data-i18n-placeholder="expectedPlayersPh" placeholder="例如 3" />
        </div>
        <div>
          <label data-i18n="maxPlayers">最大人数</label>
          <input data-param="max-players" data-i18n-placeholder="maxPlayersPh" placeholder="例如 20" />
        </div>
        <div>
          <label data-i18n="difficulty">难度</label>
          <select data-param="difficulty">
            <option value="" data-i18n="default">默认</option>
            <option value="peaceful" data-i18n="difficultyPeaceful">和平</option>
            <option value="easy" data-i18n="difficultyEasy">简单</option>
            <option value="normal" data-i18n="difficultyNormal">普通</option>
            <option value="hard" data-i18n="difficultyHard">困难</option>
          </select>
        </div>
        <div>
          <label data-i18n="gamemode">游戏模式</label>
          <select data-param="gamemode">
            <option value="" data-i18n="default">默认</option>
            <option value="survival" data-i18n="gmSurvival">生存</option>
            <option value="creative" data-i18n="gmCreative">创造</option>
            <option value="adventure" data-i18n="gmAdventure">冒险</option>
            <option value="spectator" data-i18n="gmSpectator">旁观</option>
          </select>
        </div>
        <div>
          <label data-i18n="onlineMode">在线模式</label>
          <select data-param="online-mode">
            <option value="" data-i18n="default">默认</option>
            <option value="true" data-i18n="on">开启</option>
            <option value="false" data-i18n="off">关闭</option>
          </select>
        </div>
        <div>
          <label data-i18n="pvp">PVP</label>
          <select data-param="pvp">
            <option value="" data-i18n="default">默认</option>
            <option value="true" data-i18n="on">开启</option>
            <option value="false" data-i18n="off">关闭</option>
          </select>
        </div>
        <div>
          <label data-i18n="whitelist">白名单</label>
          <select data-param="white-list">
            <option value="" data-i18n="default">默认</option>
            <option value="true" data-i18n="on">开启</option>
            <option value="false" data-i18n="off">关闭</option>
          </select>
        </div>
        <div>
          <label data-i18n="spawnProtection">出生保护</label>

        </div>

    </div>

    <div class="card">
      <h2 data-i18n="performance">性能参数</h2>
      <div class="row">
        <div>

        <div>

        </div>

        </div>

        <div>

            <option value="" data-i18n="default">默认</option>
            <option value="true" data-i18n="on">开启</option>

          <label data-i18n="serverPort">MC 端口</label>

            <option value="invsee" data-i18n="installInvsee">\u5b89\u88c5 InvSee++</option>

      <label data-i18n="customHint">额外 key=value（每行一条）</label>

      <div class="hint" data-i18n="customHint2">将覆盖上方与导入配置中的值。</div>
    </div>

    <div class="card">
      <div class="actions">
        <button id="btn_plan" data-i18n="btnPlan">运行 Plan（评审）</button>
        <button id="btn_apply" data-i18n="btnApply">执行 Apply</button>
        <button id="btn_save" class="secondary" data-i18n="btnSave">\u4fdd\u5b58\u914d\u7f6e</button>
      </div>

      <div class="hint" id="apply_notice" data-i18n="applyNotice">\u53ef\u80fd\u9700\u8981\u6570\u5206\u949f\u5230\u6570\u5341\u5206\u949f\uff0c\u8bf7\u8010\u5fc3\u7b49\u5f85\u3002</div>
      <label style="margin-top:12px;" data-i18n="output">\u8f93\u51fa</label>
      <div id="apply_progress" class="progress-wrap hidden">
        <div class="progress-bar"><div id="apply_progress_fill" class="progress-fill"></div></div>
        <div class="progress-meta"><span id="apply_progress_label"></span><span id="apply_progress_pct">0%</span></div>
      </div>
      <div id="output" class="output"></div>
      <div class="hint"><span data-i18n="panelHint">如已安装主面板：</span> <a id="panel_link" href="/" target="_blank" data-i18n="panelLink">打开面板</a></div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modal_title">完成</h3>
      <p id="modal_body">已执行。</p>
      <div class="actions">
        <button id="modal_close" class="secondary">知道了</button>
      </div>
    </div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const output = $('output');
const panelLink = $('panel_link');


async function getNonce() {
  const res = await fetch('/api/wizard/nonce');
  if (!res.ok) throw new Error('nonce failed');
  return await res.json();
}

function toHex(buffer) {
  return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function signOtp(otp, nonce, host) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    'raw',
    enc.encode(otp),
    {name: 'HMAC', hash: 'SHA-256'},
    false,
    ['sign']
  );
  const data = enc.encode(`${nonce}:${host}`);
  const sig = await crypto.subtle.sign('HMAC', key, data);
  return toHex(sig);
}

    panelHint: 'If panel is installed:',
    panelLink: 'Open panel',
    default: 'Default',
    on: 'On',
    off: 'Off'
  }
};

function applyLang(lang) {
  const dict = translations[lang] || translations.zh;
  document.documentElement.lang = lang;
  document.title = dict.title || document.title;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (dict[key]) el.setAttribute('placeholder', dict[key]);
  });
}

async function loadState() {
  const res = await fetch('/api/wizard/state');
  if (!res.ok) return;
  const data = await res.json();
  $('version').value = data.version || '1.21.11';
  $('profile').value = data.profile || 'normal';
  $('import_mode').value = data.import_mode || 'none';
  $('import_value').value = data.import_value || '';
  $('params_extra').value = data.params_text || '';
  if (data.panel_url) panelLink.href = data.panel_url;
  if (data.lang) {
    $('lang').value = data.lang;
    applyLang(data.lang);
  }
}

function gather() {
  const params = {};
  document.querySelectorAll('[data-param]').forEach((el) => {
    const key = el.getAttribute('data-param');
    const val = (el.value || '').trim();
    if (val !== '') params[key] = val;
  });
  return {
    version: $('version').value.trim() || '1.21.11',
    profile: $('profile').value,
    otp: $('otp').value.trim(),
    import_mode: $('import_mode').value,
    import_value: $('import_value').value.trim(),
    params: params,
    params_text: $('params_extra').value,
    lang: $('lang').value
  };
}


async function buildHeaders(otp) {
  const headers = {'Content-Type':'application/json'};
  const cleanOtp = (otp || '').trim();
  if (cleanOtp && window.crypto && crypto.subtle) {
    const meta = await getNonce();
    const sig = await signOtp(cleanOtp, meta.nonce, meta.host || location.host);
    headers['X-MCIC-NONCE'] = meta.nonce;
    headers['X-MCIC-OTP-SIG'] = sig;
  } else if (cleanOtp) {
    headers['X-MCIC-OTP'] = cleanOtp;
  }
  return headers;
}

let applyHangTimer = null;
function showHangAlert() {
  const msg = $('lang').value === 'zh'
    ? '执行时间较长，可能卡住。请查看输出/日志，必要时 SSH 登录检查。'
    : 'Apply is taking longer than expected. Check output/logs via SSH and retry if needed.';
  showModal($('lang').value === 'zh' ? '\u6267\u884c\u544a\u8b66' : 'Apply warning', msg);
}

function startProgress() {
  const wrap = $('apply_progress');
  const fill = $('apply_progress_fill');
  const pct = $('apply_progress_pct');
  const label = $('apply_progress_label');
  wrap.classList.remove('hidden');
  label.textContent = $('lang').value === 'zh' ? '\u6267\u884c\u4e2d' : 'Running?';
  let value = 1;
  fill.style.width = value + '%';
  pct.textContent = value + '%';
  const timer = setInterval(() => {
    value = Math.min(90, value + Math.random() * 6 + 2);
    fill.style.width = value.toFixed(0) + '%';
    pct.textContent = value.toFixed(0) + '%';
  }, 800);
  return { stop: (ok) => {
    clearInterval(timer);
    const final = ok ? 100 : Math.max(95, value);
    fill.style.width = final + '%';
    pct.textContent = final + '%';
    label.textContent = ok ? ($('lang').value === 'zh' ? '\u5b8c\u6210' : 'Completed') : ($('lang').value === 'zh' ? '\u5931\u8d25' : 'Failed');
  }};
}

function showModal(title, body) {
  const modal = $('modal');
  $('modal_title').textContent = title;
  $('modal_body').textContent = body;
  $('modal_close').textContent = $('lang').value === 'zh' ? '知道了' : 'OK';
  modal.classList.remove('hidden');
}

$('modal_close').onclick = () => { $('modal').classList.add('hidden'); };

async function saveState() {
  const payload = gather();
  const otp = payload.otp;
  delete payload.otp;
  const headers = await buildHeaders(otp);
  await fetch('/api/wizard/state', {method:'POST', headers, body: JSON.stringify(payload)});
}

async function runAction(path) {
  output.textContent = '...';
  const payload = gather();
  const otp = payload.otp;
  delete payload.otp;
  const headers = await buildHeaders(otp);
  const res = await fetch(path, {method:'POST', headers, body: JSON.stringify(payload)});
  const data = await res.json();
  output.textContent = data.output || data.error || JSON.stringify(data);
  return {res, data};
}

$('btn_plan').onclick = async () => { await runAction('/api/wizard/plan'); };
$('btn_apply').onclick = async () => {
  const btn = $('btn_apply');
  btn.disabled = true;
  btn.classList.add('btn-disabled');
  const original = btn.textContent;
  btn.textContent = $('lang').value === 'zh' ? '执行中...' : 'Applying...';
  const progress = startProgress();
  if (applyHangTimer) clearTimeout(applyHangTimer);
  applyHangTimer = setTimeout(showHangAlert, 180000);
  const {data} = await runAction('/api/wizard/apply');
  const ok = data && (data.ok === true || data.ok === 'true');
  if (ok) {
    if (applyHangTimer) { clearTimeout(applyHangTimer); applyHangTimer = null; }
    progress.stop(true);
    showModal($('lang').value === 'zh' ? '\u6267\u884c\u5b8c\u6210' : 'Apply completed', $('lang').value === 'zh' ? '\u6267\u884c\u5df2\u5b8c\u6210\uff0c\u8bf7\u628a\u9f20\u6807\u79fb\u5f00\u6309\u94ae\u533a\u57df\u3002' : 'Apply finished. Please move your mouse away from the Apply button.');
  } else {
    if (applyHangTimer) { clearTimeout(applyHangTimer); applyHangTimer = null; }
    progress.stop(false);
    showModal($('lang').value === 'zh' ? '\u6267\u884c\u5931\u8d25' : 'Apply failed', $('lang').value === 'zh' ? '\u6267\u884c\u672a\u6210\u529f\uff0c\u8bf7\u67e5\u770b\u8f93\u51fa\u4fe1\u606f\u3002' : 'Apply failed. Check the output for details.');
  }
  btn.textContent = original;
};
$('btn_save').onclick = async () => { await saveState(); output.textContent = 'OK'; };

$('lang').onchange = () => { applyLang($('lang').value); };

applyLang('zh');
loadState();
</script>
</body>
</html>
