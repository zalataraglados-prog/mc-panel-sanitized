<script>
const $ = (id) => document.getElementById(id);
const output = $('output');
const panelLink = $('panel_link');

function parseParamsText(text) {
  const params = {};
  (text || '').split(/
?
/).forEach(line => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#') || !trimmed.includes('=')) return;
    const [key, ...rest] = trimmed.split('=');
    params[key.trim()] = rest.join('=').trim();
  });
  return params;
}

function collectParams() {
  const params = {};
  document.querySelectorAll('[data-param]').forEach(el => {
    const key = el.getAttribute('data-param');
    if (!key) return;
    let value = '';
    if (el.tagName === 'SELECT' || el.tagName === 'INPUT') {
      value = (el.value || '').trim();
    }
    if (value === '') return;
    params[key] = value;
  });
  const extra = parseParamsText($('params_extra').value || '');
  Object.keys(extra).forEach(k => { params[k] = extra[k]; });
  return params;
}

function paramsToText(params) {
  return Object.entries(params).map(([k, v]) => `${k}=${v}`).join('
');
}

async function loadState() {
  const res = await fetch('/api/wizard/state');
  if (!res.ok) return;
  const data = await res.json();
  $('version').value = data.version || '1.21.4';
  $('profile').value = data.profile || 'normal';
  $('import_mode').value = data.import_mode || 'none';
  $('import_value').value = data.import_value || '';
  $('params_extra').value = data.params_text || '';
  if (data.panel_url) panelLink.href = data.panel_url;

  const params = parseParamsText(data.params_text || '');
  document.querySelectorAll('[data-param]').forEach(el => {
    const key = el.getAttribute('data-param');
    if (key && params[key] !== undefined) {
      el.value = params[key];
    }
  });

  await loadCatalog();
}

function gather() {
  const params = collectParams();
  return {
    version: $('version').value.trim() || '1.21.4',
    profile: $('profile').value,
    import_mode: $('import_mode').value,
    import_value: $('import_value').value.trim(),
    params_text: paramsToText(params),
    otp: ($('otp') ? $('otp').value.trim() : '')
  };
}

async function saveState() {
  await fetch('/api/wizard/state', {method:'POST', headers:{'Content-Type':'application/json','X-MCIC-OTP': (gather().otp || '')}, body: JSON.stringify(gather())});
}

function reviewLevel(outputText) {
  const lower = outputText.toLowerCase();
  if (outputText.includes('???') || lower.includes('block')) return 'block';
  if (outputText.includes('??') || lower.includes('warn')) return 'warn';
  return 'allow';
}

async function runPlan() {
  output.textContent = '???...';
  const res = await fetch('/api/wizard/plan', {method:'POST', headers:{'Content-Type':'application/json','X-MCIC-OTP': (gather().otp || '')}, body: JSON.stringify(gather())});
  const data = await res.json();
  output.textContent = data.output || data.error || JSON.stringify(data);
  return data.output || '';
}

async function runApply() {
  output.textContent = '???...';
  const res = await fetch('/api/wizard/apply', {method:'POST', headers:{'Content-Type':'application/json','X-MCIC-OTP': (gather().otp || '')}, body: JSON.stringify(gather())});
  const data = await res.json();
  output.textContent = data.output || data.error || JSON.stringify(data);
}

async function runApplyWithReview() {
  const planOutput = await runPlan();
  const level = reviewLevel(planOutput);
  if (level === 'block') {
    alert('????????????????');
    return;
  }
  if (level === 'warn') {
    const ok = confirm('????????????? Apply?');
    if (!ok) return;
  }
  const snippet = (planOutput || '').slice(0, 1500);
  const ok2 = confirm('?????????????\n\n' + snippet);
  if (!ok2) return;
  await runApply();
}

function makeField(key, meta) {
  const wrapper = document.createElement('div');
  wrapper.className = 'field';
  const label = document.createElement('label');
  label.textContent = key;
  wrapper.appendChild(label);

  let input;
  const defVal = meta && meta.default;
  if (typeof defVal === 'boolean') {
    input = document.createElement('select');
    input.innerHTML = '<option value="">??</option><option value="true">true</option><option value="false">false</option>';
  } else if (typeof defVal === 'number') {
    input = document.createElement('input');
    input.type = 'number';
    input.placeholder = String(defVal);
  } else {
    input = document.createElement('input');
    input.type = 'text';
    input.placeholder = defVal !== undefined ? String(defVal) : '';
  }
  input.setAttribute('data-param', key);
  wrapper.appendChild(input);

  if (meta && meta.description) {
    const small = document.createElement('small');
    small.textContent = meta.description;
    wrapper.appendChild(small);
  }
  return wrapper;
}

async function loadCatalog() {
  const version = $('version').value.trim() || '1.21.4';
  const res = await fetch(`/api/wizard/catalog?version=${encodeURIComponent(version)}`);
  if (!res.ok) return;
  const data = await res.json();
  const container = $('catalog_sections');
  container.innerHTML = '';

  const sections = [
    {key: 'server_properties', title: 'server.properties ??'},
    {key: 'gamerule', title: 'gamerule ??'}
  ];

  sections.forEach(sec => {
    const entries = (data.catalog && data.catalog[sec.key] && data.catalog[sec.key].entries) || {};
    const detail = document.createElement('details');
    detail.open = false;
    const summary = document.createElement('summary');
    summary.textContent = sec.title + `?${Object.keys(entries).length}?`;
    detail.appendChild(summary);
    const grid = document.createElement('div');
    grid.className = 'grid';
    Object.keys(entries).forEach(k => {
      grid.appendChild(makeField(k, entries[k] || {}));
    });
    detail.appendChild(grid);
    container.appendChild(detail);
  });
}

$('btn_plan').onclick = async () => { await runPlan(); };
$('btn_apply').onclick = async () => { await runApplyWithReview(); };
$('btn_save').onclick = async () => { await saveState(); output.textContent = '???'; };
