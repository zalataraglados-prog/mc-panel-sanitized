<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme Background Preview</title>
    <link rel="stylesheet" href="./src/theme.css" />
    <style>
      body {
        min-height: 100vh;
      }
      .preview-wrap {
        max-width: 960px;
        margin: 24px auto;
        background: var(--card);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      .preview-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .preview-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .preview-row .btn {
        border-radius: 999px;
        padding: 6px 14px;
      }
      .preview-status {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }
      .preview-panel {
        margin-top: 16px;
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }
      .preview-card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 12px;
      }
      .preview-card h3 {
        font-size: 12px;
        margin: 0 0 6px;
        color: var(--muted);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .preview-card p {
        margin: 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body data-theme="dark" data-skin="minimal">
    <div class="preview-wrap">
      <div class="preview-title">Theme Background Preview</div>
      <div class="preview-row">
        <button class="btn" data-theme="dark">Dark</button>
        <button class="btn" data-theme="light">Light</button>
      </div>
      <div class="preview-row">
        <button class="btn" data-skin="minimal">Minimal</button>
        <button class="btn" data-skin="pixel">Pixel</button>
        <button class="btn" data-skin="tech">Tech</button>
        <button class="btn" data-skin="retro">Retro</button>
      </div>
      <div class="preview-status" id="previewStatus"></div>
      <div class="preview-panel">
        <div class="preview-card">
          <h3>Dashboard</h3>
          <p>Live metrics, status, and quick actions.</p>
        </div>
        <div class="preview-card">
          <h3>Players</h3>
          <p>Cards, actions, and inventory access.</p>
        </div>
        <div class="preview-card">
          <h3>Map</h3>
          <p>Embedded map preview with overlays.</p>
        </div>
        <div class="preview-card">
          <h3>Console</h3>
          <p>Command line and log stream.</p>
        </div>
      </div>
    </div>

    <script>
      const status = document.getElementById("previewStatus");
      const updateStatus = () => {
        status.textContent = `Theme: ${document.body.dataset.theme} | Skin: ${document.body.dataset.skin}`;
      };
      document.querySelectorAll("[data-theme]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.body.dataset.theme = btn.dataset.theme;
          updateStatus();
        });
      });
      document.querySelectorAll("[data-skin]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.body.dataset.skin = btn.dataset.skin;
          updateStatus();
        });
      });
      updateStatus();
    </script>
  </body>
</html>
